<div class="gallery-container flex-grow-1" #galleryContainer
    [ngClass]="size ? size : ''">
    <!-- Botón de navegación anterior -->
    <button *ngIf="showPrevButton$ | async"
        class="carousel-control-prev d-none d-md-block"
        (click)="scrollLeft()"
        aria-label="Anterior">
        &#10094;
    </button>

    <!-- Contenedor del carrusel -->
    <div class="gallery" #carousel>
        <ul>
            <li *ngFor="let item of items; let i = index"
                [class.active]="i === currentIndex"
                [class.home-route]="isHomeRoute">
                <img [src]="item.image" [alt]="item.title" (click)="openImageViewer(i)" />
                <div class="content" *ngIf="isHomeRoute">
                    <span><h2>{{ item.title }}</h2></span>
                </div>
            </li>
        </ul>
    </div>

    <!-- Botón de navegación siguiente -->
    <button *ngIf="showNextButton$ | async"
        class="carousel-control-next d-none d-md-block"
        (click)="scrollRight()"
        aria-label="Siguiente">
        &#10095;
    </button>

    <!-- Indicadores de página -->
    <div class="carousel-indicators">
        <span *ngFor="let page of pages; let i = index"
            [class.active]="i === getCurrentPage()"
            (click)="scrollToIndex(i)"
            [attr.aria-label]="'Ir a la página ' + (i + 1)">
        </span>
    </div>
</div>

<!-- Modal/Lightbox para visualización ampliada -->
<div class="image-viewer-overlay" *ngIf="isImageViewerOpen" (click)="closeImageViewer()">
    <div class="image-viewer-container" (click)="$event.stopPropagation()">
        <button class="close-button" (click)="closeImageViewer()" aria-label="Cerrar">
            &times;
        </button>
        
        <div class="image-wrapper">
            <img [src]="items[selectedImageIndex].image" [alt]="items[selectedImageIndex].title" class="fullscreen-image">
            
            <button *ngIf="selectedImageIndex > 0" 
                    class="nav-button prev-button" 
                    (click)="navigateImage(-1)" 
                    aria-label="Imagen anterior">
                &#10094;
            </button>
            
            <button *ngIf="selectedImageIndex < items.length - 1" 
                    class="nav-button next-button" 
                    (click)="navigateImage(1)" 
                    aria-label="Imagen siguiente">
                &#10095;
            </button>
        </div>
    </div>
</div>
