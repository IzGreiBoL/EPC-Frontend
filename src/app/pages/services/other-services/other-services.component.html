<div class="services-bg py-5">
  <div class="container">
    <ng-container *ngFor="let service of services; let i = index">
      <div class="row align-items-center mb-5 flex-lg-row" [ngClass]="{'flex-lg-row-reverse': i % 2 === 1}">
        <div class="col-12 col-lg-6 d-flex flex-column justify-content-center">
          <h2 class="service-title mb-3" [ngClass]="{'text-accent': i % 2 === 1}">
            <span class="fw-bold">{{ service.title.split(' ')[0] }}</span>
            <span *ngIf="service.title.split(' ').length > 1">
              {{ service.title.split(' ').slice(1).join(' ') }}
            </span>
          </h2>
          <p class="service-desc mb-4 text-light">{{ service.text }}</p>
          <div class="d-flex gap-3">
            <button class="button-primary">{{ service.quoteButtonText }}</button>
          </div>
        </div>
        <div class="col-12 col-lg-6 d-flex justify-content-center">
          <div class="service-card p-4">
            <img *ngIf="service.image" [src]="service.image" alt="{{ service.title }}" class="img-fluid rounded mb-3">
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</div>
