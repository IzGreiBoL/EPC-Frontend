<div class="container-fluid">
  <div class="row justify-content-center mt-4">
    <div class="col-lg-6 col-md-6 mb-4" *ngFor="let item of items">
      <div class="custom-card d-flex flex-column flex-lg-row align-items-center">
        <!-- Imagen -->
        <div class="image-container">
          <a [routerLink]="['/quotes/detail', item.id, item.id === 999 ? 'custom' : 'basic']">
            <img [src]="getFirstImage(item.folder)" class="card-img-top"
              alt="Image">
          </a>
        </div>

        <!-- Contenido -->
        <div class="card-body text-center text-lg-start">
          <h3 class="card-title">{{ item.name }}</h3>
          <p class="card-subtitle">{{ item.size }} sq. ft.</p>
          <div
            class="d-flex justify-content-center justify-content-lg-start align-items-center mb-3">
            <div class="d-flex align-items-center me-3">
              <lucide-angular [img]="bedroomsIcon"></lucide-angular>
              <span class="ms-1">{{ item.bedrooms }}</span>
            </div>
            <div class="d-flex align-items-center">
              <lucide-angular [img]="bathroomsIcon"></lucide-angular>
              <span class="ms-1">{{ item.bathrooms }}</span>
            </div>
          </div>

          <!-- Botones -->
          <div class="quote-buttons">
            <button class="button-secondary"
              *ngIf="item.id !== 999"
              [routerLink]="['/quotes/detail', item.id, 'basic']">Basic
              Quote</button>
            <button class="button-primary"
              [routerLink]="['/quotes/detail', item.id, item.id === 999 ? 'custom' : 'advanced']">
              {{ item.id === 999 ? 'Custom Quote' : 'Advanced Quote' }}
            </button>
          </div>
        </div>
      </div>
    </div>
</div>
